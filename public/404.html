<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // SPA redirect for GitHub Pages: preserve path/query/hash and send to index with encoded param
      (function () {
        var base = "/baze-swipe";
        var path = window.location.pathname.startsWith(base)
          ? window.location.pathname.slice(base.length)
          : window.location.pathname;
        var query = window.location.search || "";
        var hash = window.location.hash || "";
        var target = base + "/?p=" + encodeURIComponent(path + query + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
