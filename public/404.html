<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=/baze-swipe/" />
    <script>
      // Preserve path for SPA routing on GitHub Pages
      (function () {
        var path = window.location.pathname.replace(/^\/baze-swipe/, "");
        var query = window.location.search || "";
        var hash = window.location.hash || "";
        window.location.replace("/baze-swipe/" + path + query + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
